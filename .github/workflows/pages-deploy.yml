name: Deploy client + sync server to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy sync server (PartyKit)
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
        run: npx partykit deploy

  deploy-client:
    runs-on: ubuntu-latest
    needs: deploy-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client assets
        env:
          VITE_PARTYKIT_HOST: ${{ secrets.VITE_PARTYKIT_HOST }}
          VITE_PARTYKIT_PARTY: ${{ secrets.VITE_PARTYKIT_PARTY }}
        run: npm run build

      - name: Deploy static assets via Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
