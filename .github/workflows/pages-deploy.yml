name: Deploy client + sync server to Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

concurrency:
  group: cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-server-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production sync server
        run: npx partykit deploy --name "${{ secrets.PARTYKIT_NAME_PROD }}"

  deploy-client-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: deploy-server-prod
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production client assets
        env:
          VITE_PARTYKIT_HOST: ${{ secrets.VITE_PARTYKIT_HOST_PROD }}
          VITE_PARTYKIT_PARTY: ${{ secrets.VITE_PARTYKIT_PARTY }}
        run: npm run build

      - name: Deploy production static assets via Workers
        run: npx wrangler deploy --name "${{ secrets.WORKER_NAME_PROD }}"

  deploy-server-staging:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy staging sync server
        run: npx partykit deploy --name "${{ secrets.PARTYKIT_NAME_STAGING }}"

  deploy-client-staging:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    needs: deploy-server-staging
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging client assets
        env:
          VITE_PARTYKIT_HOST: ${{ secrets.VITE_PARTYKIT_HOST_STAGING }}
          VITE_PARTYKIT_PARTY: ${{ secrets.VITE_PARTYKIT_PARTY }}
        run: npm run build

      - name: Deploy staging static assets via Workers
        run: npx wrangler deploy --name "${{ secrets.WORKER_NAME_STAGING }}"
