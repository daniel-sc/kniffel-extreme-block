name: Deploy unified Cloudflare worker

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production worker assets
        run: npm run build

      - name: Deploy production worker
        run: npx wrangler deploy --env production

  deploy-staging:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging worker assets
        run: npm run build

      - name: Deploy staging worker
        run: npx wrangler deploy --env staging
